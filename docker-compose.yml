# Production stack for a VPS: the app, a private Redis for the server-setup queue, and Caddy for
# HTTPS. Start it with `docker compose up -d --build` — see DEPLOY.md.
services:
  app:
    build: .
    env_file: .env
    environment:
      # Redis runs right here (below), so the queue never depends on an outside database or its quota.
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on:
      - redis
    restart: unless-stopped
    # Not published to the internet: only Caddy talks to the app, so every visitor gets HTTPS.
    expose:
      - "3000"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # No published port on purpose: a password-less Redis open to the internet gets taken over.

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. DOMAIN=app.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  redis_data:
  caddy_data:
  caddy_config:
